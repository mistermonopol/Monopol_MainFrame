name: Validate
on: [push, pull_request]
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Coolify Compose
        run: docker compose -f compose.coolify.yaml --env-file .env.example config --quiet
      - name: Validate and build the outbound home bridge
        run: |
          docker compose -f compose.bridge.yaml --env-file .env.bridge.example config --quiet
          docker build -f bridge/Dockerfile -t mainframe-home-bridge:ci .
      - name: Build and start the complete deployment
        run: docker compose -f compose.coolify.yaml --env-file .env.example up --build -d --wait --wait-timeout 180
      - name: Check Web to API to PostgreSQL
        run: |
          docker compose -f compose.coolify.yaml --env-file .env.example exec -T web node -e "fetch('http://127.0.0.1:3000/sw.js').then(async r=>{if(!r.ok||!(await r.text()).includes('notificationclick'))process.exit(1)}).catch(()=>process.exit(1))"
          docker compose -f compose.coolify.yaml --env-file .env.example exec -T web node -e "fetch('http://127.0.0.1:3000/api/v1/healthz').then(async r=>{const body=await r.json();if(!r.ok||body.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"
          docker compose -f compose.coolify.yaml --env-file .env.example exec -T web node -e "fetch('http://127.0.0.1:3000/api/v1/session').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"
      - name: Deployment logs
        if: failure()
        run: docker compose -f compose.coolify.yaml --env-file .env.example logs --no-color
      - name: Remove CI-only containers and volumes
        if: always()
        run: docker compose -f compose.coolify.yaml --env-file .env.example down --volumes
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_PASSWORD: ci-admin-only}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: sh ops/init-db.sh
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: ci-admin-only
          APP_DB_PASSWORD: ci-app-only
          HEALTH_DB_PASSWORD: ci-health-only
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://life_app:ci-app-only@127.0.0.1/life
          TEST_HEALTH_DATABASE_URL: postgresql+psycopg://life_health:ci-health-only@127.0.0.1/life
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash android/gradlew -p android testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: everything-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
