services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      HEALTH_DB_PASSWORD: ${HEALTH_DB_PASSWORD:?Set HEALTH_DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./ops/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d life"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build: ./backend
    env_file: ${ENV_FILE:-.env}
    environment: &api-environment
      DATABASE_URL: postgresql+psycopg://life_app:${APP_DB_PASSWORD}@db/life
      HEALTH_DATABASE_URL: postgresql+psycopg://life_health:${HEALTH_DB_PASSWORD}@db/life
    command: [python, -m, app.migrate]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./backend
    env_file: ${ENV_FILE:-.env}
    environment: *api-environment
    volumes:
      - obsidian:/vault
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')"]
      interval: 30s
      retries: 3
    restart: unless-stopped
  web:
    build: ./web
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  obsidian:
